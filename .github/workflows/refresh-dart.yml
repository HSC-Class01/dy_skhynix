name: Refresh Open DART financials

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 1 * *" # 09:15 KST on the first day of every month

permissions:
  contents: write

concurrency:
  group: dart-financial-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate DART API key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::DART_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Fetch DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/fetch_dart.py --start-year 2010

      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/financials.json docs/data/financials.csv docs/data/unavailable_reports.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh Open DART financials"
            git push
          fi
