name: Refresh Open DART financials
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 1 * *' # 09:15 KST on the first day of every month
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/fetch_dart.py --start-year 2010
      - name: Commit refreshed published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data: refresh Open DART financials"
          git push
